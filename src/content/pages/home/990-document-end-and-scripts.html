  <script>
function initVideos() {
  const components = document.querySelectorAll(".video-component");
  components.forEach((component) => {
    if (component.dataset.initialized) return;
    component.dataset.initialized = "true";
    const video = component.querySelector("[cs-element='video-player']");
    const playPauseBtn = component.querySelector("[cs-element='play-button']");
    const volumeBtn = component.querySelector("[cs-element='volume-button']");
    const playIcon = component.querySelector(".play-icon");
    const pauseIcon = component.querySelector(".pause-icon");
    const volumeUp = component.querySelector(".volume-up");
    const volumeDown = component.querySelector(".volume-down");
    if (!video || !playPauseBtn || !volumeBtn) return;
    // Play / Pause
    playPauseBtn.addEventListener("click", () => {
      if (video.paused) {
        video.play();
        pauseIcon.style.display = "flex";
        playIcon.style.display = "none";
      } else {
        video.pause();
        pauseIcon.style.display = "none";
        playIcon.style.display = "flex";
      }
    });
    // Volume toggle
    volumeBtn.addEventListener("click", () => {
      video.muted = !video.muted;
      if (video.muted) {
        volumeDown.style.display = "flex";
        volumeUp.style.display = "none";
      } else {
        volumeDown.style.display = "none";
        volumeUp.style.display = "flex";
      }
    });
  });
}
// 🔴 NEW: function to stop all videos
function stopAllVideos() {
  document.querySelectorAll(".video-component").forEach((component) => {
    const video = component.querySelector("[cs-element='video-player']");
    const playIcon = component.querySelector(".play-icon");
    const pauseIcon = component.querySelector(".pause-icon");
    const volumeUp = component.querySelector(".volume-up");
    const volumeDown = component.querySelector(".volume-down");
    if (!video) return;
    video.pause();
    video.muted = true;
    // sync UI
    if (playIcon && pauseIcon) {
      pauseIcon.style.display = "none";
      playIcon.style.display = "flex";
    }
    if (volumeUp && volumeDown) {
      volumeDown.style.display = "flex";
      volumeUp.style.display = "none";
    }
  });
}
// Run on load
document.addEventListener("DOMContentLoaded", initVideos);
// ✅ When switching Webflow tabs
document.querySelectorAll(".w-tab-link").forEach((tab) => {
  tab.addEventListener("click", () => {
    stopAllVideos();          // 🔴 key fix
    setTimeout(initVideos, 50);
  });
});
</script>

  <script>
$(".home-articles_component").each(function () {
  let loopMode = $(this).attr("loop-mode") === "true";
  let sliderDuration = $(this).attr("slider-duration") 
    ? +$(this).attr("slider-duration") 
    : 300;
  const sliderEl = $(this);
  function updateProgressBar(swiper) {
    const progressBar = sliderEl.find(".swiper-drag");
    if (!progressBar.length) return;
    let totalSlides;
    let currentIndex;
    if (swiper.params.loop) {
      totalSlides = swiper.slides.length - swiper.loopedSlides * 2;
      currentIndex = swiper.realIndex;
    } else {
      totalSlides = swiper.slides.length;
      currentIndex = swiper.activeIndex;
    }
    const progress = ((currentIndex + 1) / totalSlides) * 100;
  }
  const swiper = new Swiper(sliderEl.find(".swiper")[0], {
    speed: sliderDuration,
    loop: loopMode,
    loopedSlides: 3,
    centeredSlides: true,
    slidesPerView: 1,
    spaceBetween: "4%",
    followFinger: true,
    grabCursor: true,
    mousewheel: {
      forceToAxis: true
    },
    keyboard: {
      enabled: true,
      onlyInViewport: true
    },
    breakpoints: {
      480: {
        slidesPerView: 1,
        centeredSlides: true
      },
      768: {
        slidesPerView: 1,
        centeredSlides: true
      },
      992: {
        slidesPerView: 1,
        centeredSlides: true
      }
    },
    pagination: {

      bulletActiveClass: "is-active",

      bulletElement: "button",
      clickable: true

    navigation: {

    },
    // ✅ Draggable scrollbar
    scrollbar: {
      el: sliderEl.find(".swiper-drag-wrapper")[0],
      draggable: true,
      dragClass: "swiper-drag",
      snapOnRelease: true
    },
    slideActiveClass: "is-active",
    slideDuplicateActiveClass: "is-active",
    on: {
      init: function () {
        if (this.scrollbar) this.scrollbar.updateSize();
        updateProgressBar(this);
      },
      slideChange: function () {
        updateProgressBar(this);
      }
    }
  });
});
</script>
